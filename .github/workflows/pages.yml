name: Pages

# The browser page is the path for people who do not want to install anything,
# so it gets an address of its own.
on:
  push:
    branches: [main]
    paths: ["docs/collect.html"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The page is one self-contained file, so the site is one file.
      - name: Prepare the site
        run: |
          mkdir -p _site
          cp docs/collect.html _site/index.html

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
